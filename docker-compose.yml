services:
  # ============================================
  # 🔒 GLUETUN - VPN (kill switch)
  # qBittorrent, Prowlarr et FlareSolverr partagent son réseau :
  # tout leur trafic sort par le VPN, et rien ne sort si le VPN tombe.
  # ============================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Fournisseur VPN et clés : voir vpn.env.example
    env_file:
      - vpn.env
    volumes:
      # Certificats OpenVPN (client.crt, client.key) pour CyberGhost
      - ./config/gluetun:/gluetun
    environment:
      - TZ=${TZ:-Europe/Zurich}
      # Si le port forwarding est activé dans vpn.env, gluetun reporte
      # automatiquement le port ouvert dans qBittorrent (meilleur seed).
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8085/api/v2/app/setPreferences 2>&1'
      # Autorise les conteneurs derrière le VPN à joindre Radarr/Sonarr et le LAN
      - FIREWALL_OUTBOUND_SUBNETS=172.30.0.0/24,${LAN_SUBNET:-192.168.1.0/24}
    ports:
      - "8085:8085"   # qBittorrent
      - "9696:9696"   # Prowlarr
      - "8191:8191"   # FlareSolverr
    extra_hosts:
      # Le DNS de gluetun ne connaît pas les noms Docker : on les fixe ici
      - "radarr:172.30.0.10"
      - "sonarr:172.30.0.11"
      - "flaresolverr:127.0.0.1"
    networks:
      streaming:
        ipv4_address: 172.30.0.2
        # Les autres conteneurs continuent d'utiliser ces noms
        aliases:
          - qbittorrent
          - prowlarr
          - flaresolverr

  # ============================================
  # 🎬 JELLYFIN - Media Server (like Netflix)
  # ============================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./config/jellyfin:/config
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/media:/media:ro
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/downloads:/downloads:ro

  # ============================================
  # 📥 QBITTORRENT - Torrent Client
  # ============================================
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}
      - WEBUI_PORT=8085
    volumes:
      - ./config/qbittorrent:/config
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/downloads:/downloads
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  # ============================================
  # 🔤 BAZARR - Automatic Subtitles
  # ============================================
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./config/bazarr:/config
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/media:/media
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/downloads:/downloads
    ports:
      - "6767:6767"
    networks:
      - streaming
    extra_hosts:
      - "jellyfin:host-gateway"

  # ============================================
  # 🙋 JELLYSEERR - Request Manager (now Seerr, the merged Jellyseerr/Overseerr)
  # ============================================
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-Europe/Zurich}
    ports:
      - "5055:5055"
    volumes:
      - ./config/jellyseerr:/app/config
    extra_hosts:
      - "jellyfin:host-gateway"
    restart: unless-stopped
    networks:
      - streaming

  # ============================================
  # 🔍 PROWLARR - Torrent Indexer Manager
  # ============================================
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./config/prowlarr:/config
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

  # ============================================
  # 🎬 RADARR - Movie Manager (Optional but nice)
  # ============================================
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./config/radarr:/config
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/media/movies:/movies
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/downloads:/downloads
    ports:
      - "7878:7878"
    networks:
      streaming:
        ipv4_address: 172.30.0.10

  # ============================================
  # 📺 SONARR - TV Series Manager (Optional but nice)
  # ============================================
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ./config/sonarr:/config
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/media/series:/tv
      - ${ROOT_MEDIA_PATH:-/mnt/nvme/streaming-data}/downloads:/downloads
    ports:
      - "8989:8989"
    networks:
      streaming:
        ipv4_address: 172.30.0.11

  # ============================================
  # 🛡️ FLARESOLVERR - Bypass Cloudflare (for some trackers)
  # ============================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - TZ=Europe/Zurich
      - LOG_LEVEL=info
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy


  # ============================================
  # 🌐 CLOUDFLARE TUNNEL - External Access
  # ============================================
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: streaming-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - streaming
    extra_hosts:
      - "jellyfin:host-gateway"
    depends_on:
      - jellyfin

  # ============================================
  # 📊 SYSTEM MONITORING - Glances
  # ============================================
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    pid: host
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - streaming

  # ============================================
  # 🏠 DASHBOARD - Streaming Hub (Next.js)
  # ============================================
  dashboard:
    image: node:24-alpine
    container_name: streaming-dashboard
    working_dir: /app
    volumes:
      - ./dashboard-next:/app
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    ports:
      - "8090:80"
    command: sh -c "npm install && npm run build && npm run start -- -p 80"
    restart: unless-stopped
    networks:
      - streaming
    extra_hosts:
      - "jellyfin:host-gateway"
    depends_on:
      - glances
      - radarr
      - sonarr
      - jellyfin

networks:
  streaming:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
